name: Experiment 20 GitHub Actions

on:
  push:
    branches:
      - main
      - login-module
      - dashboard-module

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python Version
        run: python --version

      - name: Test Login Module
        run: python login.py

      - name: Test Dashboard Module
        run: python dashboard.py

      - name: Workflow Completed
        run: echo "Experiment 20 GitHub Actions completed successfully!"